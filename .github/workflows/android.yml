name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.MYLIFE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MYLIFE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mylife-release.jks"
            echo "MYLIFE_KEYSTORE_FILE=$RUNNER_TEMP/mylife-release.jks" >> "$GITHUB_ENV"
            echo "MYLIFE_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "MYLIFE_KEY_ALIAS=mylife" >> "$GITHUB_ENV"
            echo "MYLIFE_KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "Using the permanent release key."
          else
            echo "No signing secrets found, using the default debug key."
          fi
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (arm64)
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: |
          # Gradle's download servers sometimes time out (504). Allow a longer wait and retry the build.
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties || true
          # Download Gradle ourselves from several places (the official server has been returning 504), then point the wrapper at the local copy.
          PROPS=gradle/wrapper/gradle-wrapper.properties
          F=$(sed -n 's/^distributionUrl=//p' "$PROPS" | sed 's#\\##g' | xargs basename)
          V=$(echo "$F" | sed -E 's/^gradle-(.*)-(bin|all)\.zip$/\1/')
          for u in "https://services.gradle.org/distributions/$F" "https://downloads.gradle.org/distributions/$F" "https://github.com/gradle/gradle-distributions/releases/download/v$V/$F" "https://mirrors.cloud.tencent.com/gradle/$F" "https://repo.huaweicloud.com/gradle/$F"; do
            echo "Trying $u"
            if curl -fL --retry 2 --retry-delay 5 --connect-timeout 20 --max-time 400 -o "$RUNNER_TEMP/$F" "$u" && unzip -tq "$RUNNER_TEMP/$F" >/dev/null 2>&1; then
              echo "Got Gradle from $u"
              sed -i "s#^distributionUrl=.*#distributionUrl=file\\\\:$RUNNER_TEMP/$F#" "$PROPS"
              break
            fi
            rm -f "$RUNNER_TEMP/$F"
          done
          grep distributionUrl "$PROPS"
          for i in 1 2 3 4; do
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon && exit 0
            echo "Build attempt $i failed, retrying in 45s..."
            sleep 45
          done
          exit 1
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MyLife.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest MyLife.apk --title "My Life 1.0 (Android APK)" --notes "Download MyLife.apk on your Android phone and install it. Built from commit ${GITHUB_SHA::7}."
      - uses: actions/upload-artifact@v4
        with:
          name: MyLife-apk
          path: MyLife.apk
