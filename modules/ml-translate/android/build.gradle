plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mltranslate'
version = '1.0.0'

android {
  namespace "expo.modules.mltranslate"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Google ML Kit on-device translation. The language packs are downloaded once, then translating works offline.
  implementation 'com.google.mlkit:translate:17.0.3'
}
